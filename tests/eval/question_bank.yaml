# RAG Evaluation Question Bank
#
# This file is the authoritative seed bank of prompts used by the RAG
# evaluation harness. Each question is independent and routed through the
# real ``RAGPipeline`` with mocked Azure + Qdrant backends so that the
# scores are reproducible across machines and CI runs.
#
# Schema (per entry):
#   id:               stable identifier (str). Never reuse across questions.
#   query:            user prompt sent to the assistant.
#   category:         one of greeting | small_talk | in_scope_factual |
#                     in_scope_temporal | out_of_scope | policy_quote |
#                     pricing_contact | ambiguous
#   expected_decision ANSWER or REFUSE (matches backend.models.chat.ChatDecision)
#   must_contain:     list of substrings that MUST appear in the answer
#                     (case-insensitive). Empty list = no positive checks.
#   must_not_contain: list of substrings that MUST NOT appear in the answer
#                     (case-insensitive). Empty list = no negative checks.
#   min_confidence:   optional float in [0, 1]. Currently advisory (the
#                     current pipeline does not surface a confidence score
#                     to callers, so the harness only enforces it when the
#                     pipeline emits one).
#   notes:            free-text rationale for reviewers / future authors.
#
# To add a question: append to the appropriate category section. To
# refresh the baseline after intentional behavior changes, run:
#     python -m tests.eval.runner --update-baseline
#
# Counts must match the spec: greeting 5, small_talk 3, in_scope_factual 15,
# in_scope_temporal 8, out_of_scope 5, policy_quote 4, pricing_contact 5,
# ambiguous 5 (total = 50).

