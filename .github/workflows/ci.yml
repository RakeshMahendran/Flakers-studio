name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r server/requirements.txt

      - name: Run backend checks
        run: python tests/backend/run_backend_suite.py --suite all

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Lint client
        run: npm run ci:lint

      - name: Build client
        run: npm run ci:build

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/widget/package-lock.json

      - name: Install widget dependencies
        run: npm ci

      - name: Build widget
        run: npm run ci:build

  performance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r server/requirements.txt

      - name: Run performance regression checks
        run: python tests/performance/run_performance_suite.py --check-baseline

  rag-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r server/requirements.txt

      - name: Install eval extras
        # The eval harness needs pytest + pyyaml in addition to the
        # production deps. respx is included for branches that opt to
        # exercise the Azure HTTP path through real httpx mocks.
        run: pip install pytest pytest-asyncio pyyaml respx

      - name: Run RAG eval suite vs baseline
        run: python -m tests.eval.runner --baseline tests/eval/baseline.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: tests/eval/reports/
